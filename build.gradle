plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.butler'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

checkstyle {
	toolVersion = '10.26.1'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:9.0.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-quartz-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	dependsOn tasks.named('frontendTest')
}

tasks.register('frontendInstall', Exec) {
	group = 'build'
	description = 'Install the React frontend dependencies from the lockfile'
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'ci'
	inputs.files(file("${rootDir}/frontend/package.json"), file("${rootDir}/frontend/package-lock.json"))
	outputs.dir(file("${rootDir}/frontend/node_modules"))
}

tasks.register('frontendBuild', Exec) {
	group = 'build'
	description = 'Build the React frontend and emit static assets for Spring Boot'
	dependsOn tasks.named('frontendInstall')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'run', 'build'
	inputs.dir(file("${rootDir}/frontend/src"))
	inputs.files(
		file("${rootDir}/frontend/index.html"),
		file("${rootDir}/frontend/package.json"),
		file("${rootDir}/frontend/package-lock.json"),
		file("${rootDir}/frontend/tsconfig.app.json"),
		file("${rootDir}/frontend/tsconfig.json"),
		file("${rootDir}/frontend/tsconfig.node.json"),
		file("${rootDir}/frontend/vite.config.ts")
	)
	outputs.dir(file("${rootDir}/src/main/resources/static"))
}

tasks.register('frontendTest', Exec) {
	group = 'verification'
	description = 'Run the React frontend test suite'
	dependsOn tasks.named('frontendInstall')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'test'
}

tasks.register('frontendLint', Exec) {
	group = 'verification'
	description = 'Lint the React frontend'
	dependsOn tasks.named('frontendInstall')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'run', 'lint'
}

tasks.register('frontendTestCoverage', Exec) {
	group = 'verification'
	description = 'Run the React frontend tests with coverage'
	dependsOn tasks.named('frontendInstall')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'run', 'test:coverage'
}

tasks.register('frontendCheck') {
	group = 'verification'
	description = 'Run the React frontend tests and lint'
	dependsOn tasks.named('frontendTest'), tasks.named('frontendLint')
}

tasks.named('check') {
	dependsOn tasks.named('frontendLint')
}

tasks.register('frontendDev', Exec) {
	group = 'application'
	description = 'Run the Vite development server'
	dependsOn tasks.named('frontendInstall')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'run', 'dev'
}

tasks.register('frontendPreview', Exec) {
	group = 'application'
	description = 'Preview the production frontend build'
	dependsOn tasks.named('frontendBuild')
	workingDir = file("${rootDir}/frontend")
	commandLine 'npm', 'run', 'preview'
}

tasks.named('processResources') {
	dependsOn tasks.named('frontendBuild')
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
