app:
  replicaCount: 1
  image:
    repository: butler
    pullPolicy: IfNotPresent
    tag: "0.0.1-SNAPSHOT"
  containerPort: 8080
  springProfiles: development
  service:
    type: ClusterIP
    port: 80
  database:
    # Set url and secretName when using an external database.
    url: ""
    secretName: ""
    usernameKey: username
    passwordKey: password
  extraEnv: []
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: butler-frontend
    pullPolicy: IfNotPresent
    tag: "0.0.1-SNAPSHOT"
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    database: butler
    username: postgres
    password: ""
    existingSecret: ""
    secretKeys:
      username: username
      password: password
  service:
    port: 5432
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    storageClass: ""
  resources: {}
