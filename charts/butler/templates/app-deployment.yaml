apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "butler.fullname" . }}
  labels:
    {{- include "butler.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "butler.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      {{- with .Values.app.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "butler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.postgresql.enabled (not .Values.app.database.url) }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "butler.fullname" . }}-postgresql -p {{ .Values.postgresql.service.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "Waiting for PostgreSQL"; sleep 2; done
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler.postgresqlSecretName" . }}
                  key: {{ .Values.postgresql.auth.secretKeys.username }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.containerPort }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.app.springProfiles | quote }}
            - name: SERVER_PORT
              value: {{ .Values.app.containerPort | quote }}
            - name: BUTLER_ELASTICSEARCH_ENABLED
              value: {{ .Values.elasticsearch.enabled | quote }}
            - name: BUTLER_ELASTICSEARCH_URI
              value: {{ if .Values.elasticsearch.uri }}{{ .Values.elasticsearch.uri | quote }}{{ else if .Values.elasticsearch.enabled }}{{ printf "http://%s-elasticsearch:%v" (include "butler.fullname" .) .Values.elasticsearch.service.port | quote }}{{ else }}{{ "http://localhost:9200" | quote }}{{ end }}
            - name: SPRING_DATASOURCE_URL
              value: {{ if .Values.app.database.url }}{{ .Values.app.database.url | quote }}{{ else }}{{ printf "jdbc:postgresql://%s-postgresql:%v/%s" (include "butler.fullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}{{ end }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler.databaseSecretName" . }}
                  key: {{ if .Values.app.database.url }}{{ .Values.app.database.usernameKey }}{{ else }}{{ .Values.postgresql.auth.secretKeys.username }}{{ end }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "butler.databaseSecretName" . }}
                  key: {{ if .Values.app.database.url }}{{ .Values.app.database.passwordKey }}{{ else }}{{ .Values.postgresql.auth.secretKeys.password }}{{ end }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
