{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "butler.fullname" . }}-postgresql
  labels:
    {{- include "butler.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ required "Set postgresql.auth.password or provide postgresql.auth.existingSecret" .Values.postgresql.auth.password | quote }}
{{- end }}
