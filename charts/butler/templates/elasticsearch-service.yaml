{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "butler.fullname" . }}-elasticsearch
  labels:
    {{- include "butler.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.elasticsearch.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "butler.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
{{- end }}
