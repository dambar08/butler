spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/butler_dev}
    username: ${DB_USERNAME:butler}
    password: ${DB_PASSWORD:butler}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
